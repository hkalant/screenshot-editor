name: Claude review

# Claude reviews every pull request: when it is opened, marked ready for review or reopened,
# and after each new push. It leaves inline comments on specific lines and one summary
# comment. It only reads the code and comments; it never pushes, approves or merges.
#
# Setup (Settings > Secrets and variables > Actions):
#   Secret   ANTHROPIC_API_KEY   An Anthropic API key (console.anthropic.com).
#   Or       CLAUDE_CODE_OAUTH_TOKEN  A Claude subscription token, from `claude setup-token`.
# The Claude GitHub App must be installed on the repository too:
# https://github.com/apps/claude. Running /install-github-app in Claude Code does both.
# With neither secret set, the review is skipped and the run stays green.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

# A new push replaces the review still running for the previous one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review the pull request
    # Drafts wait until they are ready. Pull requests from forks get no secrets, so they
    # are skipped rather than failing.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Secrets cannot be used in a job's `if`, so this step decides. It only sees whether
      # a secret is set, never its value.
      - name: Check the Claude secret
        id: check
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_KEY" != true ]; then
            message="Claude review is not set up, so it was skipped. To turn it on, add the repository secret ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN) under Settings > Secrets and variables > Actions."
            echo "::notice title=Claude review skipped::$message"
            printf '### Claude review\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review with Claude
        if: steps.check.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request to the Screenshot Editor, a Next.js app in
            apps/screenshot-editor that is exported as a static site and runs entirely in
            the browser. Look at the diff (`gh pr diff`) and read the surrounding code as
            needed. Report only real problems, most serious first:

            - Bugs: wrong behaviour, edge cases, undo/redo or autosave that loses work,
              exports that differ from the canvas.
            - Security: images, pasted data and project files are untrusted; nothing
              user-supplied may reach HTML, and screenshots must never leave the browser.
            - Workflows and deploy scripts: secrets in logs, URLs or arguments, and anything
              that could publish outside the site's subfolder.
            - Missing or weak tests for the change.

            Put each problem as an inline comment on the line it concerns, saying what goes
            wrong and how to fix it. Then post one short summary with `gh pr comment`. If
            you find nothing worth raising, say so in the summary. Don't comment on
            formatting or lint: CI checks those.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
