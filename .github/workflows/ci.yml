name: CI

on:
  pull_request:
  # The deploy workflow runs this same pipeline and deploys the "site" artifact it uploads.
  workflow_call:
    inputs:
      site_subfolder:
        description: Folder of the Bitbucket site the build is for (its base path).
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Pull requests: a new push cancels the run for the previous one. Through workflow_call the
# github context is the caller's (a push or a manual run), so each run gets its own group:
# nothing is cancelled and the group cannot collide with the caller's "deploy-bitbucket".
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/screenshot-editor

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Build for https://<workspace>.bitbucket.io/<subfolder>/, the same base path the deploy uses.
  NEXT_PUBLIC_BASE_PATH: /${{ inputs.site_subfolder || vars.BITBUCKET_SITE_SUBFOLDER || 'screenshot-editor' }}
  E2E_ALL_BROWSERS: "1"

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Playwright's image has the browsers and their system packages, so nothing comes from
    # the runner's Ubuntu mirror, which has stalled the browser install for 30 minutes.
    # Its version must match @playwright/test in package.json. As the runner's user, as
    # Playwright's docs advise: Firefox won't run as root with another user's home.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/screenshot-editor/.nvmrc
          cache: npm
          cache-dependency-path: apps/screenshot-editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Deploy script tests
        run: npm run test:publish

      - name: Build the static site
        run: npm run build

      - name: End-to-end tests
        run: npm run test:e2e

      # Artifact paths are relative to the repository root, not the working directory.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/screenshot-editor/playwright-report
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

      - name: Upload the site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: apps/screenshot-editor/out
          if-no-files-found: error
          retention-days: 7
          # A re-run of this job replaces the artifact instead of failing on the name.
          overwrite: true
